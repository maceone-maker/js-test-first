apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: cost-center-intelligence-agent
  description: AI agent enabling Finance Controllers to query SAP S/4HANA cost center data using natural language, with IAS principal propagation for per-user identity and authorization enforcement.

provides:
  apis:
    - name: cost-center-intelligence-agent
      kind: a2a
      ordId: customer.build:apiResource:cost-center-intelligence-agent-6e2b1.cost-center-intelligence-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-ce-costcenter-0001-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:cost-center-intelligence-agent-6e2b1.sap-s4-ce-costcenter-0001-mcp-server:v1
  - name: sap-s4-ce-costcenterhierarchy-0001-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:cost-center-intelligence-agent-6e2b1.sap-s4-ce-costcenterhierarchy-0001-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
